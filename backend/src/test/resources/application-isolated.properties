# 集成测试专用配置（由 pom.xml 的 surefire 以 spring.profiles.active=isolated 激活）。
#
# 为什么需要它：此前 @SpringBootTest 直接用 src/main/resources/application.yml 里的数据源，
# 也就是应用库 persona_terminal —— 测试会往真库里注册用户、写同步行、落头像文件。
# 后果有两层：真数据被测试污染；D13 给注册加上 UserID 查重之后，用例里的固定用户名
# 第二次跑就必然 409，测试整体不可用。
#
# 隔离约定：
#   · 库名必须是 persona_terminal_test —— 与应用库不同名
#   · createDatabaseIfNotExist 让第一次连接时自动建空库，随后 Flyway(baseline-on-migrate)
#     自动把 V1..Vn 建起来，不需要手工执行 SQL
#   · 上传目录指向 target/ 下，不碰 backend/uploads 里的真实头像
#
# 这里只覆盖"必须不同"的两项：库地址与上传目录。账号口令沿用 application.yml 的
# ${MYSQL_PASSWORD:root}，不在本文件重复。
spring.datasource.url=jdbc:mysql://localhost:3306/persona_terminal_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
app.upload-dir=target/test-uploads
