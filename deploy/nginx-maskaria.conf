# MASKARIA 站点配置（模板）——放到 /etc/nginx/conf.d/maskaria.conf
# 把 maskaria.example.com 换成你的域名；证书用 certbot --nginx 自动补全。

server {
    listen 80;
    server_name maskaria.example.com;

    # Let's Encrypt 域名校验（certbot --webroot / --nginx 都会用）
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name maskaria.example.com;

    ssl_certificate     /etc/letsencrypt/live/maskaria.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maskaria.example.com/privkey.pem;

    # 前端静态站（npm run build 的 dist/ 内容）
    root /opt/maskaria/web;
    index index.html;

    # 安装包停止公开分发；保留服务器文件，旧直链也返回 410。
    location = /download { return 410; }
    location ^~ /download/ { return 410; }
    location ~* \.(apk|aab)$ { return 410; }

    # 后端 API（含 AI 代理与头像读取）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 目前是整段转发，超时放宽；请求体留余量（后端单文件限 2MB、单请求 4MB）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 8m;
    }

    # SPA 回退：任何前端路由都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带指纹的构建产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker 不能长缓存，否则用户永远拿不到新版本
    location ~* (sw|service-worker)\.js$ {
        add_header Cache-Control "no-cache";
    }
}
