server {
    listen 80;
    server_name 192.144.227.216;

    # Native clients still carry the old API origin. Keep their failure explicit
    # instead of following a 302 into a GET request against the new host.
    location ^~ /api/ {
        default_type application/json;
        return 503 '{"error":"MASKARIA server migrated","new_origin":"http://150.158.174.9"}';
    }

    location = /download { return 410; }
    location ^~ /download/ { return 410; }
    location ~* \.(apk|aab)$ { return 410; }

    # Web bookmarks move to the new server temporarily. Use 302 until the new
    # hostname and rollback window are settled.
    location / {
        return 302 http://150.158.174.9$request_uri;
    }
}
