<!doctype html><meta charset="utf-8"><title>exp</title><script type="module">
import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/examples/jsm/exporters/GLTFExporter.js';
// 自测：把 Pyro Jack FBX（带 idle/attack/damage 动作）导出成「内嵌动作的 GLB」，模拟 ingest 产物格式
const o = await new FBXLoader().loadAsync('/models/pyrojack/pyrojack.fbx');
import * as THREE from 'three';
o.traverse((m) => { if (m.isMesh) { const mm = Array.isArray(m.material) ? m.material : [m.material]; m.material = Array.isArray(m.material) ? mm.map((x) => new THREE.MeshStandardMaterial({ name: x.name })) : new THREE.MeshStandardMaterial({ name: mm[0].name }); } });
const buf = await new GLTFExporter().parseAsync(o, { binary: true, animations: o.animations, onlyVisible: false });
let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
window.__out = { names: o.animations.map((a) => a.name), b64: btoa(s) }; document.title = 'done';
</script>
