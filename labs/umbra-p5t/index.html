<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>幽影协议 · P5T 规则原型（灰盒）</title>
<link rel="stylesheet" href="/fonts-sc.css" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="labels"></div>
  <div id="sk-dim"></div>
  <div id="hud-tl" class="hud"><div id="turn">TURN 1</div><div id="objective">目标：击败全部敌人</div><div id="phase">PLAYER PHASE</div>
    <div id="volt"><span>VOLTAGE</span><div class="vbar"><i></i></div><b id="volt-n">0</b></div><div id="ban" class="hidden"></div></div>
  <div id="hud-tr" class="hud"><select id="map-select"></select><button id="btn-threat" class="small">敌方范围</button><button id="btn-volt" class="small" title="灰盒调试：直接充满 Voltage">充满V</button><button id="btn-restart" class="small">重来</button></div>
  <div id="baton" class="hud hidden"></div>
  <div id="summon" class="hidden"></div>
  <div id="unit-card" class="hud hidden"></div>
  <div id="party" class="hud"></div>
  <div id="volt-star" class="hud"><div class="star"><i></i></div><span>VOLTAGE</span></div>
  <div id="endbar" class="hud"><button data-act="end" data-en="END" class="end">结束回合</button></div>
  <div id="preview" class="hud hidden"></div>
  <div id="forecast" class="hud hidden"></div>
  <div id="actions" class="hud">
    <button data-act="melee" data-en="MELEE">近战</button>
    <button data-act="gun" data-en="GUN">枪</button>
    <button data-act="skill" data-en="SKILL">技能</button>
    <button data-act="wait" data-en="WAIT">待机</button>
    <button data-act="unique" data-en="UNIQUE" class="unique">专属</button>
    <button data-act="triple" class="triple hidden">TRIPLE THREAT</button>
  </div>
  <div id="skills" class="hud hidden"></div>
  <!-- r17：枪击瞄准牌 = 原版 bom02_shot/back_reversal_dialog（含「使用枪械攻击 / 放弃」字样）；A/B 圆钮 prefab_ButtonHelpIcon 未导出 → CSS 重建 -->
  <div id="aim" class="hidden"><div class="aimcard shot" data-aim="shot"><span class="fb"><b>SHOT</b><small>使用枪械攻击</small></span><i class="pad pa">A</i></div><div class="aimcard back" data-aim="back"><span class="fb"><b>BACK</b><small>放弃</small></span><i class="pad pb">B</i></div></div>
  <div id="banner" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="result" class="hidden"></div>
  <!-- r13：原版底部操作提示条（move_3532/command_3429：LB 切换角色 RB / 分析 / 回合结束 / 切换显示范围 / 暂停；敌方回合只有「快进」）。
       键位图标贴图未导出 → CSS 重建；文字白字黑描边。手机上各项可点（原版是手柄键位）。 -->
  <div id="hintbar" class="hud"><span data-h="cycle"><i class="k pill">LB</i>切换角色<i class="k pill">RB</i></span><span data-h="analyse"><i class="k lt">LT</i>分析</span><span data-h="end" class="hl"><i class="k view"></i>回合结束</span><span data-h="range"><i class="k dpad"></i>切换显示范围</span><span data-h="pause"><i class="k menu"></i>暂停</span><span data-h="ff" class="ff"><i class="k pill">A</i>快进</span></div>
  <div id="rotate-hint">请横屏游玩</div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
